# Builds the backend image (server/Dockerfile) and pushes it to Docker Hub on
# every push to master that touches the backend, so the deploy host only has
# to `docker compose pull && docker compose up -d` to pick up the latest code.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  -- the Docker Hub account (vithiru)
#   DOCKERHUB_TOKEN     -- a Docker Hub access token with Read & Write scope
#
# Tags pushed: `latest` (what the compose file pulls) and the commit SHA (an
# immutable tag to roll back to, since `latest` is overwritten every push).
name: Publish backend image

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            viththiru/colonist-tracker-api:latest
            viththiru/colonist-tracker-api:${{ github.sha }}
          # Reuse layers (notably the pip install) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
